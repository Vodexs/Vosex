<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESHA 505 | PREMIERE</title>
    <style>
        /* ستايل "ديشا - فكرة مبرمج" */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Black+Ops+One&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Cairo', sans-serif;
        }

        /* 🖼️ الخلفية المتحركة (زي اللي في الفيديو) */
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://w0.peakpx.com/wallpaper/1010/374/HD-wallpaper-landscape-pixel-art-sunset-scenery.jpg') center/cover;
            filter: brightness(0.5);
            z-index: -1;
            animation: bgZoom 20s infinite alternate;
        }

        @keyframes bgZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* 🛡️ الكارد الزجاجي المودرن */
        .container {
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 30px;
            width: 85%; max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .profile-img {
            width: 120px; height: 120px; border-radius: 50%;
            border: 3px solid #fff; margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 42px; margin: 0;
            background: linear-gradient(to bottom, #fff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status { color: #00f2ff; font-weight: bold; letter-spacing: 5px; margin-bottom: 40px; display: block; }

        /* 🚀 الزراير الشفافة بجد */
        .links { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            text-decoration: none; color: #fff;
            padding: 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 700; transition: 0.3s;
        }

        .btn:hover {
            background: #fff; color: #000;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <div class="card">
            <img src="desha.jpg" alt="DESHA" class="profile-img">
            
            <h1>DESHA 505</h1>
            <span class="status">V I P • S Y S T E M</span>

            <div class="links">
                <a href="https://whatsapp.com/channel/0029VbBvRhSKrWQzap5xB022" class="btn">قناة ملصقات واتساب 🔥</a>
                <a href="https://wa.me/201019349123" class="btn">تواصل واتساب 💬</a>
                <a href="https://t.me/desha505" class="btn">تليجرام ✈️</a>
                <a href="https://www.facebook.com/share/1DZU63MBZ5/" class="btn">فيسبوك 👤</a>
            </div>
        </div>
    </div>

</body>
</html>

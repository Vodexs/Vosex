<!DOCTYPE html>

        body {
            margin: 0;
            padding: 50px 20px; /* مساحة عشان ميبقاش لازق في حواف الموبايل */
            background-color: #080808;
            color: white;

            min-height: 100vh;
        }

        /* 📸 برواز الصورة - لازم ترفع صورتك باسم desha.jpg */
        .profile-card {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff4500;

            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-card img {
            width: 100%;

            object-fit: cover;
        }

        h1 {
            font-size: 40px;

            text-shadow: 0 0 10px #ff4500;

        .status {
            background: #ff4500;

        /* 🔥 الزراير - حماس من غير عك */
        .links-group {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 18px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            border: 2px solid #333;
            transition: 0.3s ease;
            background: rgba(255, 69, 0, 0.05);
        }

        .btn:hover {
            border-color: #ff4500;
            background: #ff4500;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.6);
            transform: translateY(-5px);
        }

        /* ألوان مخصصة لكل زرار */
        .wa:hover { background-color: #25d366; border-color: #25d366; color: #fff; }
        .tg:hover { background-color: #0088cc; border-color: #0088cc; color: #fff; }
        .fb:hover { background-color: #1877f2; border-color: #1877f2; color: #fff; }

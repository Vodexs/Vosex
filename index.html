<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DESHA 505 | PRO</title>
    <style>
        /* ستايل "غسيل السمعة" - ديشا 2026 */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #050505; /* أسود ملكي */
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* خلفية فخمة جداً بتتحرك */
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }

        .main-card {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            /* حركة الزتونة عشان "تبعد عن وشك" */
            margin-top: -20px; 
        }

        /* 📸 الصورة ببرواز نيون بينبض */
        .profile-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            border-radius: 50%;
            position: relative;
            padding: 4px;
            background: linear-gradient(45deg, #00f2ff, #7000ff);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            animation: pulse-glow 3s infinite;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000;
        }

        /* ✨ النبض الهادي على الكلام */
        h1 {
            font-size: 38px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-pulse 2s infinite alternate;
        }

        .status {
            font-size: 14px;
            color: #00f2ff;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 50px;
            display: block;
            opacity: 0.8;
        }

        /* 🛡️ الزراير الشفافة المظبوطة (Glassmorphism) */
        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05); /* شفافية بجد */
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); /* تأثير القزاز */
            -webkit-backdrop-filter: blur(15px);
            font-weight: 700;
            font-size: 17px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: #00f2ff;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 242, 255, 0.2);
        }

        /* 🔄 الأنيميشن */
        @keyframes text-pulse {
            from { filter: drop-shadow(0 0 2px rgba(0,242,255,0.4)); }
            to { filter: drop-shadow(0 0 15px rgba(0,242,255,0.8)); }
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(0, 242, 255, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="profile-container">
            <img src="desha.jpg" alt="DESHA" class="profile-img">
        </div>

        <h1>DESHA 505</h1>
        <span class="status">ACTIVE SYSTEM</span>

        <div class="links">
            <a href="https://whatsapp.com/channel/0029VbBvRhSKrWQzap5xB022" class="btn">🚀 قناة الملصقات النارية</a>
            <a href="https://wa.me/201019349123" class="btn">💬 تواصل عبر واتساب</a>
            <a href="https://t.me/desha505" class="btn">✈️ حسابي على تليجرام</a>
            <a href="https://www.facebook.com/share/1DZU63MBZ5/" class="btn">👤 بروفايل الفيسبوك</a>
        </div>
    </div>

    <div class="footer">DESHA DESIGN • 2026</div>

</body>
</html>

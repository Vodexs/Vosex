<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESHA 505 | 🔥 جحيم التقنية</title>
    <style>
        /* ستايل "ديشا 505 v2.1" - شغل عالي فششششخ بصورة ديشا الحقيقية */
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cairo:wght@700;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Cairo', sans-serif; color: #fff;
            display: flex; justify-content: center; align-items: center;
        }

        /* 🔥 الخلفية النارية الحقيقية */
        .fire-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJndnZ6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3ImZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/Lopx9eUi34rbq/giphy.gif') center/cover;
            filter: brightness(0.4) contrast(1.2);
            z-index: -1;
        }

        /* 🛡️ الكارد الزجاجي المحروق */
        .card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid #ff4500;
            border-radius: 20px;
            padding: 60px 30px 40px; /* زودت الـ padding عشان الصورة */
            width: 85%; max-width: 380px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.6);
            position: relative;
            animation: shake 5s infinite;
        }

        /* 📸 ستايل الصورة الشخصية المنورة */
        .profile-container {
            width: 130px;
            height: 130px;
            margin: -100px auto 25px; /* حركة صايعة تخلي الصورة طالعة بره الكارد */
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 69, 0, 0.6);
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* عشان الصورة متتمطش */
        }

        /* 🌟 الاسم الملهب */
        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 38px; margin: 0;
            background: linear-gradient(to bottom, #fff 20%, #ffae00 50%, #ff4500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.8));
            letter-spacing: 3px;
        }

        .id-tag {
            color: #ffae00; font-size: 13px; margin-bottom: 20px;
            font-weight: bold; letter-spacing: 5px;
        }

        .bio { font-size: 15px; color: #ddd; margin: 15px 0 25px; line-height: 1.5; }

        /* 🔥 الأزرار الرايقة */
        .links { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            text-decoration: none; color: #fff;
            padding: 14px; border-radius: 10px;
            font-weight: 900; font-size: 16px;
            background: rgba(255, 69, 0, 0.15);
            border: 1px solid #ff4500;
            transition: 0.3s all ease-in-out;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn:hover {
            background: #ff4500; color: #000;
            box-shadow: 0 0 30px #ff4500;
            transform: scale(1.05);
        }

        /* ⚡ أنيميشن اهتزاز خفيف */
        @keyframes shake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .footer { margin-top: 30px; font-size: 10px; color: #666; letter-spacing: 2px; }

    </style>
</head>
<body>

    <div class="fire-bg"></div>

    <div class="card">
        <div class="profile-container">
            <img src="https://i.postimg.cc/50p06C4p/IMG-20251101-190623.jpg" alt="Desha Profile" class="profile-img">
        </div>

        <div class="id-tag">SYSTEM: DESHA 505</div>
        <h1>D E S H A</h1>
        <p class="bio">⚡ مبرمج بايثون | خبير أمن تقني<br>صاحب أقوى مصلحة رشق في مصر 🔥</p>

        <div class="links">
            <a href="https://whatsapp.com/channel/0029VbBvRhSKrWQzap5xB022" class="btn" target="_blank">
                <span>🔥</span> قناة الملصقات النارية
            </a>
            <a href="https://wa.me/201019349123" class="btn" target="_blank">
                <span>💬</span> واتساب: +201019349123
            </a>
            <a href="https://t.me/desha505" class="btn" target="_blank">
                <span>✈️</span> تليجرام: @desha505
            </a>
            <a href="https://www.facebook.com/share/1DZU63MBZ5/" class="btn" target="_blank">
                <span>👤</span> بروفايل الفيسبوك
            </a>
        </div>

        <div class="footer">MADE BY DESHA • 2026</div>
    </div>

</body>
</html>

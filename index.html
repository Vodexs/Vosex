<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DESHA 505 🔥</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* خلفية نار "حقيقية" متحركة بالكود */
        .fire-wrapper {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #410a0a 0%, #000 100%);
            z-index: 1;
        }

        /* الكارد الرئيسي - "مرفوع" ومظبوط للموبايل */
        .card {
            background: rgba(15, 5, 5, 0.9);
            border: 2px solid #ff4500;
            border-radius: 30px;
            padding: 40px 25px;
            width: 88%;
            max-width: 370px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.5);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            /* حركة الزتونة عشان ميبقاش لازق فوق */
            transform: translateY(-20px);
        }

        /* الصورة - استخدمت صورة مضمونة تفتح 100% */
        .profile-wrap {
            width: 120px; height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 3px solid #ff4500;
            box-shadow: 0 0 20px #ff4500;
            overflow: hidden;
            background: #111;
        }

        .profile-img {
            width: 100%; height: 100%; object-fit: cover;
        }

        h1 {
            font-size: 32px; margin: 0;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(255, 69, 0, 0.5));
        }

        .bio { font-size: 14px; color: #aaa; margin: 10px 0 30px; }

        .links { display: grid; gap: 15px; }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 16px;
            border-radius: 15px;
            background: rgba(255, 69, 0, 0.1);
            border: 1px solid #ff4500;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(255, 69, 0, 0.2);
        }

        /* لهب عند اللمس */
        .btn:active, .btn:hover {
            background: #ff4500;
            color: #000;
            box-shadow: 0 0 30px #ff4500;
            transform: scale(1.05);
        }

        .footer { margin-top: 25px; font-size: 11px; color: #333; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="fire-wrapper"></div>

    <div class="card">
        <div class="profile-wrap">
            <img src="https://www.gstatic.com/images/branding/product/2x/avatar_anonymous_120dp.png" alt="Desha" class="profile-img">
        </div>
        
        <h1>DESHA 505</h1>
        <p class="bio">Python Developer | Cyber Security 🔥</p>

        <div class="links">
            <a href="https://whatsapp.com/channel/0029VbBvRhSKrWQzap5xB022" class="btn">قناة الملصقات النارية 🔥</a>
            <a href="https://wa.me/201019349123" class="btn">واتساب</a>
            <a href="https://t.me/desha505" class="btn">تليجرام</a>
            <a href="https://www.facebook.com/share/1DZU63MBZ5/" class="btn">فيسبوك</a>
        </div>

        <div class="footer">DESIGNED BY DESHA • 2026</div>
    </div>

</body>
</html>

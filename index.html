<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESHA 505 | PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 100px 20px 60px; /* مسافة كبيرة فوق عشان "تبعد" عن وشك */
            background: #080808;
            color: white;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* خلفية متدرجة فخمة جداً */
            background: radial-gradient(circle at top, #121c35 0%, #050505 100%);
            overflow-x: hidden;
        }

        /* 📸 برواز الصورة "المتوهج" */
        .profile-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(0, 242, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            padding: 5px;
            margin-bottom: 30px;
            animation: pulse-border 3s infinite;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        /* ✨ الكلام اللي بينبض */
        h1 {
            font-size: 38px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to right, #fff, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-pulse 2s infinite alternate;
        }

        .status-tag {
            font-size: 14px;
            color: #00f2ff;
            letter-spacing: 3px;
            margin-bottom: 50px;
            opacity: 0.8;
            font-weight: bold;
        }

        /* 🛡️ الزراير الشفافة (Glassmorphism) */
        .links-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px; /* مسافة بين الزراير مريحة */
        }

        .btn {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03); /* شفافية قوية */
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); /* تأثير القزاز */
            -webkit-backdrop-filter: blur(15px);
            font-weight: 700;
            font-size: 17px;
            text-align: center;
            transition: 0.4s all ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: rgba(0, 242, 255, 0.5);
            color: #fff;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 242, 255, 0.15);
        }

        /* 🔄 Animations */
        @keyframes text-pulse {
            from { filter: drop-shadow(0 0 2px rgba(0,242,255,0.2)); opacity: 0.9; }
            to { filter: drop-shadow(0 0 10px rgba(0,242,255,0.6)); opacity: 1; }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
            50% { box-shadow: 0 0 35px rgba(0, 242, 255, 0.5); }
            100% { box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        }

        .footer {
            margin-top: auto;
            padding: 40px 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="desha.jpg" alt="DESHA" class="profile-img">
    </div>

    <h1>DESHA 505</h1>
    <div class="status-tag">ACTIVE SYSTEM</div>

    <div class="links-container">
        <a href="https://whatsapp.com/channel/0029VbBvRhSKrWQzap5xB022" class="btn">قناة ملصقات واتساب 🚀</a>
        <a href="https://wa.me/201019349123" class="btn">تواصل واتساب 💬</a>
        <a href="https://t.me/desha505" class="btn">تليجرام ✈️</a>
        <a href="https://www.facebook.com/share/1DZU63MBZ5/" class="btn">فيسبوك 👤</a>
    </div>

    <div class="footer">© 2026 DESHA DESIGN</div>

</body>
</html>
